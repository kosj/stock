name: "KRX Supply/Value Cache"

# KRX 수급(외국인/기관 순매수)·밸류(PER/PBR)를 Supabase krx_daily에 적재.
# friday-prophet(07:00 UTC)이 이 캐시를 읽으므로 그 전에 먼저 돌도록 06:40 UTC 예약.
#   06:40 UTC = 15:40 KST (한국장 마감 15:30 직후)
# ※ KRX 데이터 마켓플레이스는 로그인 필수 → KRX_ID/KRX_PW Secret 필요.
#   GitHub 러너(해외 IP)에서 KRX 로그인/조회가 막히면 로컬(krx_daily.bat)로 폴백.
on:
  schedule:
    - cron: "40 6 * * 1-5"      # 평일(월~금) 06:40 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental(기본, 최근 7일) | backfill(5년 전체)"
        required: false
        default: "incremental"

jobs:
  krx-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements-krx.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-krx.txt

      - name: Run KRX cache loader
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID:                    ${{ secrets.KRX_ID }}
          KRX_PW:                    ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED:          "1"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            python -u scripts/krx_cache.py --backfill
          else
            python -u scripts/krx_cache.py
          fi
