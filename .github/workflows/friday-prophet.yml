name: "Hybrid Stacking Ensemble Weekly"

# 매주 금요일 16:12 KST (07:12 UTC) — 한국장 마감(15:30) 후, krx-cache(06:40 UTC) 이후.
# 분을 정시(:00)에서 떼는 이유: GitHub Actions schedule 이벤트는 매 정시에 부하가
# 몰려 수 시간씩 지연/드롭된다(공식 문서 권고). 정시를 피하면 지연이 크게 줄어든다.
on:
  schedule:
    # 금요일 단일 실행. GitHub Actions 큐 사정에 따라 실제 시작은 늦어질 수 있다.
    - cron: "12 7 * * 5"      # 금요일 16:12 KST
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능
    inputs:
      feature_report:
        description: "1=피처 순열 중요도 리포트 출력 (마지막 폴드 ΔIC)"
        default: "0"
      dry_run:
        description: "1=Supabase 저장 생략(결과만 로그 출력) — 팩터/유니버스 변경 검증용"
        default: "0"
      skip_if_done:
        description: "1=오늘 결과가 이미 저장돼 있으면 건너뜀 (정기 실행과 동일 동작)"
        default: "0"

# 정기 실행과 수동 실행이 겹쳐도 한 번에 하나만 돈다. 뒤에 온 실행은 앞 실행이
# 저장을 마친 뒤 시작하며, skip_if_done 옵션 사용 시 저장 여부를 확인해 건너뛴다.
# 진행 중인 학습을 중단하지 않도록 cancel-in-progress 는 끈다.
concurrency:
  group: hybrid-ensemble-weekly
  cancel-in-progress: false

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    # 단일 스레드 고정으로 학습이 느려진 만큼 여유를 둔다(기존 40분).
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 오늘 결과가 이미 저장됐는지 확인 (정기 슬롯 분산의 중복 방지) ──────────
      # 기준일은 hybrid_ensemble.py 의 run_date 와 같은 KST 날짜다.
      # 실패는 "진행"으로 처리한다(fail-open) — 확인 스텝의 오류 때문에 그날
      # 추천이 통째로 빠지는 것이 중복 실행보다 훨씬 나쁘다.
      - name: 오늘 결과 저장 여부 확인
        id: already
        if: ${{ github.event_name == 'schedule' || inputs.skip_if_done == '1' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          CNT=0
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            CNT=$(curl -sS -m 20 \
              "$SUPABASE_URL/rest/v1/recommendation_batches?run_date=eq.$TODAY&select=run_date&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)' 2>/dev/null || echo 0)
          fi
          echo "run_date=$TODAY 완료 배치: $CNT"
          if [ "${CNT:-0}" -gt 0 ]; then
            echo "done=1" >> "$GITHUB_OUTPUT"
            echo "오늘 결과가 이미 저장돼 있어 이 슬롯은 건너뜁니다."
          else
            echo "done=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: ${{ steps.already.outputs.done != '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: ${{ steps.already.outputs.done != '1' }}
        run: pip install -r scripts/requirements.txt

      - name: Run Hybrid Stacking Ensemble
        if: ${{ steps.already.outputs.done != '1' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 뉴스 감성 분석용 (미설정 시 감성=중립으로 graceful degrade)
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # 수동 실행에서만 피처 리포트 활성화 가능 (schedule에선 inputs가 비어 '0')
          FEATURE_REPORT: ${{ inputs.feature_report || '0' }}
          PYTHONUNBUFFERED: "1"      # stdout 실시간 스트리밍 (취소 시 로그 유실 방지)
          # ── 재현성: 수치 연산 스레드 전면 1개 고정 ──────────────────────────
          # 부동소수점 덧셈은 결합법칙이 성립하지 않아, 병렬 축약(reduction)의
          # 완료 순서가 달라지면 결과 끝자리가 흔들린다. 점수 차가 근소한 종목의
          # 순위가 그 끝자리로 뒤집힌다.
          # 실측: 시세 스냅샷으로 입력을 완전히 고정(지문 3종 일치)하고 sklearn
          # RF도 n_jobs=1로 바꿨는데도 예측출력 지문만 계속 달랐다
          #   66d351161675 vs 180be8f56561 (2026-08-16)
          # 라이브러리를 하나씩 짚는 대신 OpenMP/BLAS 계층을 통째로 단일 스레드로
          # 고정한다(LightGBM은 OMP_NUM_THREADS, numpy/scipy는 BLAS 변수를 따른다).
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run || '0' }}" = "1" ]; then ARGS="--dry-run"; fi
          python -u scripts/hybrid_ensemble.py $ARGS
