name: "Hybrid Stacking Ensemble Weekly"

# Primary: Friday 16:12 KST. Recovery slots share the same execution guard.
# GitHub schedules have no delivery SLA; even these slots can be delayed/dropped.
on:
  schedule:
    - cron: "12 7 * * 5"       # Fri 16:12 KST
    - cron: "42 8,11 * * 5"    # Fri 17:42 / 20:42 KST
    - cron: "42 0,6 * * 6"     # Sat 09:42 / 15:42 KST, still Friday's batch
  workflow_dispatch:
    inputs:
      feature_report:
        description: "1=피처 순열 중요도 리포트 출력"
        default: "0"
      dry_run:
        description: "1=추천 저장 생략; 실행 영수증은 운영 완료로 취급하지 않음"
        default: "0"
      skip_if_done:
        description: "호환 입력. 모든 운영 실행은 항상 완료/보류/실패 이력을 검사함"
        default: "1"

permissions:
  contents: read
  actions: read

# Receipt upload completes BEFORE the next run may inspect history. Do not split
# recovery into another concurrency group or cancel training to admit a new slot.
concurrency:
  group: hybrid-ensemble-weekly
  cancel-in-progress: false

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    # 단일 스레드 고정으로 학습이 느려진 만큼 여유를 둔다(기존 40분).
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan weekly execution from batch and outcome evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "1" ]; then ARGS+=(--dry-run); fi
          python3 scripts/weekly_execution.py plan "${ARGS[@]}"

      - name: Setup Python 3.11
        if: ${{ steps.plan.outputs.train == '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: ${{ steps.plan.outputs.train == '1' }}
        run: pip install -r scripts/requirements.txt

      - name: Run Hybrid Stacking Ensemble
        if: ${{ steps.plan.outputs.train == '1' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 뉴스 감성 분석용 (미설정 시 감성=중립으로 graceful degrade)
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # 수동 실행에서만 피처 리포트 활성화 가능 (schedule에선 inputs가 비어 '0')
          FEATURE_REPORT: ${{ inputs.feature_report || '0' }}
          MODEL_QUALITY_REPORT: model-quality.json
          PYTHONUNBUFFERED: "1"      # stdout 실시간 스트리밍 (취소 시 로그 유실 방지)
          # ── 재현성: 수치 연산 스레드 전면 1개 고정 ──────────────────────────
          # 부동소수점 덧셈은 결합법칙이 성립하지 않아, 병렬 축약(reduction)의
          # 완료 순서가 달라지면 결과 끝자리가 흔들린다. 점수 차가 근소한 종목의
          # 순위가 그 끝자리로 뒤집힌다.
          # 실측: 시세 스냅샷으로 입력을 완전히 고정(지문 3종 일치)하고 sklearn
          # RF도 n_jobs=1로 바꿨는데도 예측출력 지문만 계속 달랐다
          #   66d351161675 vs 180be8f56561 (2026-08-16)
          # 라이브러리를 하나씩 짚는 대신 OpenMP/BLAS 계층을 통째로 단일 스레드로
          # 고정한다(LightGBM은 OMP_NUM_THREADS, numpy/scipy는 BLAS 변수를 따른다).
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: python -u scripts/weekly_execution.py execute

      - name: Finalize execution receipt
        if: ${{ always() && steps.plan.outputs.run_date != '' }}
        run: python3 scripts/weekly_execution.py finalize

      - name: Save execution receipt
        if: ${{ always() && steps.plan.outputs.run_date != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-execution-${{ steps.plan.outputs.run_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: weekly-execution.json
          if-no-files-found: error
          retention-days: 90

      - name: Save model quality evidence even when publication is rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-model-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: model-quality.json
          if-no-files-found: warn
          retention-days: 30
