name: "Prophet Weekly Top 10"

# 매주 금요일 15:30 KST (= 06:30 UTC) — 한국장 마감 후 30분
on:
  schedule:
    - cron: "30 6 * * 5"
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능

jobs:
  run-prophet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Prophet TOP 10 분석 실행"
        id: call
        run: |
          RESPONSE=$(curl -sfL --max-time 120 \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/prophet-top10" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ 요청 실패 (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "body=$BODY" >> "$GITHUB_OUTPUT"

      - name: "결과 요약 출력"
        if: success()
        env:
          PROPHET_BODY: ${{ steps.call.outputs.body }}
        run: |
          python3 << 'EOF'
          import json, os, sys

          raw = os.environ.get('PROPHET_BODY', '').strip()
          if not raw:
              print("⚠️ 응답 데이터 없음")
              sys.exit(1)
          data = json.loads(raw)

          print(f"✅ 분석 완료: {data['analyzed']}/{data['total']} 종목")
          print(f"📅 기준일: {data['run_date']}")
          print()
          print("📊 TOP 3 추천:")
          for r in data.get('top3', []):
              print(f"  {r['rank']}위  {r['name']} ({r['ticker']}) — Base {r['base_return_30d']:+.1f}% / Bull {r['bull_return_30d']:+.1f}% / Bear {r['bear_return_30d']:+.1f}%  [{r['recommendation']}]")
          EOF
