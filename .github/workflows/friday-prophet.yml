name: "Prophet Weekly Top 10"

# 매주 금요일 15:30 KST (= 06:30 UTC) — 한국장 마감 후 30분
on:
  schedule:
    - cron: "30 6 * * 5"
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능

jobs:
  run-prophet:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Prophet TOP 10 분석 실행"
        run: |
          echo "=== WORKFLOW VERSION: v5-debug ==="

          RESPONSE=$(curl -sfL --max-time 120 \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/prophet-top10" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "=== BODY (${#BODY} bytes) ==="
          echo "$BODY"
          echo "=== END BODY ==="

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ 요청 실패 (HTTP $HTTP_STATUS)"
            exit 1
          fi

          if [ -z "$BODY" ]; then
            echo "❌ BODY가 비어 있습니다"
            exit 1
          fi

          echo "$BODY" | python3 -c '
import json, sys
raw = sys.stdin.read().strip()
print("=== PYTHON: raw bytes =", len(raw), "===")
if not raw:
    print("❌ Python stdin이 비어 있습니다")
    sys.exit(1)
data = json.loads(raw)
print("✅ 분석 완료: {}/{} 종목".format(data["analyzed"], data["total"]))
print("📅 기준일: {}".format(data["run_date"]))
print()
print("📊 TOP 3 추천:")
for r in data.get("top3", []):
    print("  {}위  {} ({}) — Base {:+.1f}% / Bull {:+.1f}% / Bear {:+.1f}%  [{}]".format(
        r["rank"], r["name"], r["ticker"],
        r["base_return_30d"], r["bull_return_30d"], r["bear_return_30d"],
        r["recommendation"]))
'
