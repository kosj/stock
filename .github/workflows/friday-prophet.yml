name: "Hybrid Stacking Ensemble Daily"

# 매일 16:00 KST (07:00 UTC) — 한국장 마감(15:30) 후 30분
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Hybrid Stacking Ensemble
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 뉴스 감성 분석용 (미설정 시 감성=중립으로 graceful degrade)
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: python scripts/hybrid_ensemble.py
