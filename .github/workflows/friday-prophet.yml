name: "Hybrid Stacking Ensemble Daily"

# 매일 16:12 KST (07:12 UTC) — 한국장 마감(15:30) 후, krx-cache(06:40 UTC) 이후.
# 분을 정시(:00)에서 떼는 이유: GitHub Actions schedule 이벤트는 매 정시에 부하가
# 몰려 수 시간씩 지연/드롭된다(공식 문서 권고). 정시를 피하면 지연이 크게 줄어든다.
on:
  schedule:
    - cron: "12 7 * * 1-5"   # 평일만 — 주말은 장이 없어 새 시세가 없다(러너 낭비)
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능
    inputs:
      feature_report:
        description: "1=피처 순열 중요도 리포트 출력 (마지막 폴드 ΔIC)"
        default: "0"

jobs:
  run-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Hybrid Stacking Ensemble
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 뉴스 감성 분석용 (미설정 시 감성=중립으로 graceful degrade)
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # 수동 실행에서만 피처 리포트 활성화 가능 (schedule에선 inputs가 비어 '0')
          FEATURE_REPORT: ${{ inputs.feature_report || '0' }}
          PYTHONUNBUFFERED: "1"      # stdout 실시간 스트리밍 (취소 시 로그 유실 방지)
        run: python -u scripts/hybrid_ensemble.py
