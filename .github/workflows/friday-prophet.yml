name: "Prophet Daily Recommendations"

# 매일 오후 4:00 KST (= 07:00 UTC) — 한국장 마감(15:30) 후 30분
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능

jobs:
  run-prophet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Prophet 추천 종목 분석 실행"
        run: |
          RESPONSE=$(curl -sL --max-time 120 \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/prophet-top10" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Response: $BODY"
            echo "요청 실패 (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "$BODY" | python3 -m json.tool
