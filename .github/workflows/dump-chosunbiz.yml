name: "Dump: 조선비즈 피드 상세"
on: { workflow_dispatch: }
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -u scripts/probe_news_feeds.py --dump "https://biz.chosun.com/arc/outboundfeeds/rss/?outputType=xml"
