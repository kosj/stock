name: Stock verification
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nonfunctional placeholders: builds must not need live trading credentials.
      SUPABASE_URL: https://review.invalid
      SUPABASE_SERVICE_ROLE_KEY: review-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://review.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: review-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit unique migrations and immutable applied SQL
        run: npm run audit:migrations
      - run: node --test scripts/test_*.mjs frontend/components/portfolio/*.test.mjs
      - run: node --experimental-strip-types scripts/test_news_curation.mts
      - run: npm run typecheck
      - run: npm run lint:baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/test_model_safety.py
      - run: python scripts/test_data_quality.py
      - run: python scripts/test_recommendation_diagnostics.py
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: python -m compileall -q backend/app
      - run: npm run build
