name: "Daily Auto Trade (Mock)"

# 월~금 16:00 KST (= 07:00 UTC) — 한국장 마감 후 실행
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:          # GitHub Actions UI에서 수동 실행 가능

jobs:
  auto-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "자동매매 실행"
        run: |
          # -f 제거: HTTP 오류 시 curl이 exit 22로 죽지 않도록
          RESPONSE=$(curl -sL --max-time 120 \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/auto-trade" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "요청 실패 (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "$BODY" | python3 -m json.tool || true
