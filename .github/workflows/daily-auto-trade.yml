name: "Daily Auto Trade (Mock)"
on:
  schedule:
    - cron: "12 0 * * 1-5"
  workflow_dispatch:
concurrency:
  group: daily-auto-trade
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  auto-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Drain durable queue with bounded retries
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          url = os.environ['APP_URL'].rstrip('/') + '/api/cron/auto-trade'
          for attempt in range(20):
              req = urllib.request.Request(url, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['CRON_SECRET']})
              try:
                  response = urllib.request.urlopen(req, timeout=65)
              except urllib.error.HTTPError as error:
                  response = error
              except (TimeoutError, OSError):
                  if attempt == 19: raise
                  time.sleep(30)
                  continue
              with response:
                  status = response.code
                  body = json.loads(response.read())
              print(json.dumps({'attempt': attempt + 1, 'status': status,
                  'pending': body.get('pending'), 'failed': body.get('failed') }))
              if status == 200 and body.get('success'):
                  break
              if status in (401, 403, 409) or (status == 503 and body.get('failed') and not body.get('pending')):
                  raise SystemExit('Queue blocked or terminal job failure; inspect database receipts')
              if attempt == 19:
                  raise SystemExit('Queue not drained; pending jobs remain durable for manual retry')
              time.sleep(30)
