name: "Probe ETF Data Sources"

# 수동 전용 진단 잡: 국내 상장 ETF 전체 목록/시세를 클라우드에서 수집 가능한
# 소스가 무엇인지 실측한다(네이버 vs Yahoo vs KRX). 부작용 없음(읽기 전용).
on:
  workflow_dispatch:
  # 기본 브랜치에 병합되기 전에도 검증할 수 있도록 작업 브랜치 push에서 실행.
  # (workflow_dispatch는 기본 브랜치에 존재해야만 API 트리거가 가능하다.)
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/probe_etf_sources.py"
      - "scripts/verify_etf_universe.mjs"
      - "scripts/review_etf_picks.mjs"
      - ".github/workflows/probe-etf-sources.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe sources (stdlib only)
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/probe_etf_sources.py

      # 프런트(naver-etf.ts)와 동일한 수집·디코딩·분류 절차를 실제 응답으로 검증
      - name: Verify full ETF universe pipeline
        if: ${{ !cancelled() }}
        run: node scripts/verify_etf_universe.mjs

      # 추천 품질 감사: 상위 추천에 저유동·소형·중복노출 종목이 오르는지 실측
      - name: Review ETF pick quality
        if: ${{ !cancelled() }}
        run: node scripts/review_etf_picks.mjs
