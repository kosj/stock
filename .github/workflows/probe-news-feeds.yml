name: "Probe News Feeds"

# 뉴스 페이지가 쓸 RSS 피드의 도달성을 실측하는 수동 진단 잡. 읽기 전용.
# 에이전트/로컬에서는 언론사 도메인이 아웃바운드 정책에 막혀(HTTP 000) 확인이 안 된다.
# 피드는 언제든 죽거나 형식이 바뀌므로, 뉴스 페이지가 비면 먼저 이걸 돌린다.
on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: "지정 시 그 피드의 항목별 링크 경로·카테고리를 덤프(내용 점검용). 비우면 전체 도달성 진단"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths: ["scripts/probe_news_feeds.py"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 도달성만으로는 부족하다 — HTTP 200 에 항목이 많아도 내용이 다른 분야일 수
      # 있다(조선비즈 아웃바운드 피드: 40건 중 금융 1건, 나머지 스포츠/연예).
      # dump_url 을 주면 그 피드의 링크 경로 분포를 찍어 내용을 확인한다.
      - run: |
          if [ -n "${{ inputs.dump_url }}" ]; then
            python -u scripts/probe_news_feeds.py --dump "${{ inputs.dump_url }}"
          else
            python -u scripts/probe_news_feeds.py
          fi
        env:
          PYTHONUNBUFFERED: "1"
