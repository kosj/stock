name: "Vercel Deploy Hook"

# Vercel Hobby 플랜은 비소유자(봇) 커밋/푸시의 자동 배포를 차단한다
# ("commit author did not have contributing access").
# Deploy Hook은 author·푸시 주체 검사와 무관하게 "해당 브랜치의 최신 커밋"을
# 빌드하므로, master push마다 훅을 호출해 배포를 보장한다.
#
# 활성화 방법(1회):
#   1) Vercel → 프로젝트 → Settings → Git → Deploy Hooks
#      → Name: master-deploy, Branch: master 로 생성 → URL 복사
#   2) GitHub 저장소 → Settings → Secrets and variables → Actions
#      → New repository secret: 이름 VERCEL_DEPLOY_HOOK, 값 = 복사한 URL
# 시크릿 미설정 시 이 워크플로우는 아무것도 하지 않고 통과한다(무해).
on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 시크릿 미설정 — 건너뜀 (설정 방법은 워크플로우 파일 주석 참고)"
            exit 0
          fi
          curl -sS -X POST "$HOOK" -o /dev/null -w "Vercel hook HTTP %{http_code}\n"
