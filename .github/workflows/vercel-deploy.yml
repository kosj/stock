name: "Vercel Deploy"

# Vercel Hobby가 비소유자 연동 커밋의 자동 배포를 차단하는 문제의 확정 우회.
# GitHub attribution이 소유자(kosj)로 정확해도 차단이 재현돼, git 연동을 거치지
# 않는 두 경로를 제공한다:
#   1순위) Vercel CLI 토큰 배포 — 토큰 소유자(=계정 주인) 명의의 배포로 처리되어
#          author 검사 자체가 없다. 필요한 시크릿 3개:
#          - VERCEL_TOKEN      : vercel.com → Account Settings → Tokens → Create
#          - VERCEL_ORG_ID     : Account Settings → General 의 ID (또는 .vercel/project.json)
#          - VERCEL_PROJECT_ID : 프로젝트 → Settings → General → Project ID
#   2순위) Deploy Hook (VERCEL_DEPLOY_HOOK) — 토큰 미설정 시 폴백.
# 시크릿이 하나도 없으면 아무것도 하지 않는다(무해).
on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy via Vercel CLI (token)
        id: cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Vercel의 Sensitive 환경변수는 vercel pull로 내려받을 수 없어
          # 빌드(page data 수집)가 실패한다 → GitHub Secrets로 직접 주입.
          SB_URL:  ${{ secrets.SUPABASE_URL }}
          SB_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "cli=skipped" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN/ORG_ID/PROJECT_ID 미설정 — CLI 배포 건너뜀"
            exit 0
          fi
          # 프로젝트 환경변수(비민감분)를 내려받아 원격 빌드와 동일 조건으로 빌드
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          # 비어있지 않은 값만 export (빈 값으로 유효한 pulled env를 덮지 않도록)
          [ -n "$SB_URL" ] && export SUPABASE_URL="$SB_URL"
          [ -n "$SB_KEY" ] && export SUPABASE_SERVICE_ROLE_KEY="$SB_KEY"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "cli=done" >> "$GITHUB_OUTPUT"

      - name: Fallback deploy hook
        if: ${{ steps.cli.outputs.cli != 'done' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 미설정 — 건너뜀"
            exit 0
          fi
          curl -sS -X POST "$HOOK" -o /dev/null -w "Vercel hook HTTP %{http_code}\n"
