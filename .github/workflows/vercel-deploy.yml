name: Vercel Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/trading-safety-tests.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require migration rollout acknowledgement
        env:
          RECONCILED: ${{ vars.MIGRATION_HISTORY_RECONCILED }}
        run: |
          if [ "$RECONCILED" != "true" ]; then
            echo "::error::Reconcile migration history, apply required migrations, then set MIGRATION_HISTORY_RECONCILED=true. See docs/build-ci-runbook.md."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy the verified checkout
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are required."
            exit 1
          fi
          # Remote build uses the project's production environment variables.
          # Pin the upload CLI; never deploy an unchecked latest-branch hook.
          npx --yes vercel@41.7.8 deploy --prod --archive=tgz --yes --token="$VERCEL_TOKEN"
