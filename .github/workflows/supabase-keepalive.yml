name: "Supabase Keep-Alive"

# 무료 플랜: 7일 비활성 시 자동 일시정지
# 월~금은 auto-trade(07:00 UTC)가 DB를 건드리므로 주말만 ping
on:
  schedule:
    - cron: "0 9 * * 6,0"   # 토·일 09:00 UTC (18:00 KST)
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: "Supabase DB ping"
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/portfolios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase ping HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "206" ]; then
            echo "Supabase ping 실패 (HTTP $RESPONSE) — DB가 일시정지 상태일 수 있습니다."
            exit 1
          fi

          echo "Supabase 활성 상태 확인 완료"
